name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Run by hand (Actions tab ▸ Build ▸ Run workflow) to build the DMGs as
  # downloadable artifacts without making a release.
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build the Quick Look extension
        run: |
          bash quicklook/build.sh
          lipo -archs src-tauri/target/quicklook/MDViewerQuickLook.appex/Contents/MacOS/MDViewerQuickLook

  create-release:
    # Tags like v0.3.0 get a draft release, created once here so the parallel
    # builds below all upload to it instead of racing to create it.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - name: Create the draft release
        id: release
        uses: actions/github-script@v7
        env:
          NOTARIZED: ${{ secrets.APPLE_CERTIFICATE != '' && (secrets.APPLE_API_PRIVATE_KEY != '' || secrets.APPLE_PASSWORD != '') }}
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const version = tag.replace(/^v/, "");
            const signing = process.env.NOTARIZED === "true"
              ? "Signed with a Developer ID and notarised by Apple."
              : "This build isn't notarised: the first time you open it, macOS blocks it. Go to System Settings ▸ Privacy & Security and click **Open Anyway**.";
            const body = [
              "**Install:** download the `.dmg` for your Mac below (macOS 13 or later), open it and drag MDViewer to Applications.",
              "",
              `- **Apple silicon** (M1 and later): \`MDViewer_${version}_aarch64.dmg\``,
              `- **Intel:** \`MDViewer_${version}_x64.dmg\``,
              `- **Not sure?** \`MDViewer_${version}_universal.dmg\` works on both, but is bigger. (Apple menu ▸ About This Mac shows which chip you have.)`,
              "",
              signing,
              "",
              "To open Markdown files with MDViewer by double-click, choose **MDViewer ▸ Settings… ▸ Make Default**.",
            ].join("\n");
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `MDViewer ${tag}`,
              body,
              draft: true,
            });
            return data.id;

  build:
    # One DMG per target, uploaded to the draft release on tags, or kept as
    # workflow artifacts on manual runs. With the Apple secrets set, apps are
    # signed with the Developer ID and notarised (see "Set up signing" for the
    # secrets); without them they're ad-hoc signed, which macOS accepts after
    # "Open Anyway" (an unsigned bundle would be reported as damaged).
    needs: [test, create-release]
    if: ${{ !failure() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-latest
    # Notarisation normally takes minutes, but Apple sometimes holds a
    # submission for hours; fail instead, so the job can be rerun.
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: [universal-apple-darwin, aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - name: Set up signing
        # With a Developer ID certificate, import it into a temporary keychain
        # before the build: the Quick Look extension is signed while it's built
        # (quicklook/build.sh), before Tauri signs the app around it. Then pick
        # notarisation credentials: an App Store Connect API key, or an Apple ID
        # with an app-specific password. Without a certificate, sign ad-hoc.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Values go to later steps through $GITHUB_ENV; empty ones are left
          # out, since they would make the bundler try (and fail) to use them.
          pass() { { echo "$1<<__VALUE__"; printf '%s\n' "$2"; echo "__VALUE__"; } >> "$GITHUB_ENV"; }

          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Developer ID certificate: signing ad-hoc."
            pass APPLE_SIGNING_IDENTITY "-"
            pass MDV_SIGNING adhoc
            exit 0
          fi
          if [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::error::APPLE_CERTIFICATE is set, so APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY are needed too."
            exit 1
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/certificate.p12"
          # Let codesign use the key without a prompt, and search this keychain.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "$keychain" | grep -qF "\"$APPLE_SIGNING_IDENTITY\""; then
            echo "::error::The certificate doesn't contain the identity named in APPLE_SIGNING_IDENTITY."
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi
          pass APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          pass MDV_KEYCHAIN "$keychain"

          if [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            echo "Signing with the Developer ID; notarising with an App Store Connect API key."
            key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
            pass APPLE_API_KEY "$APPLE_API_KEY_ID"
            pass APPLE_API_ISSUER "$APPLE_API_ISSUER"
            pass APPLE_API_KEY_PATH "$key_path"
            pass MDV_SIGNING notarized
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "Signing with the Developer ID; notarising with an Apple ID."
            pass APPLE_ID "$APPLE_ID"
            pass APPLE_PASSWORD "$APPLE_PASSWORD"
            pass APPLE_TEAM_ID "$APPLE_TEAM_ID"
            pass MDV_SIGNING notarized
          else
            echo "::warning::Signing with the Developer ID, but not notarising: set APPLE_API_KEY_ID, APPLE_API_ISSUER and APPLE_API_PRIVATE_KEY (or APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID). macOS will still warn when the app is first opened."
            pass MDV_SIGNING signed
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty on manual runs: then it only builds.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}
      - name: Check the signature
        run: |
          set -euo pipefail
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/MDViewer.app"
          appex="$app/Contents/PlugIns/MDViewerQuickLook.appex"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$appex"
          if [ "$MDV_SIGNING" = adhoc ]; then
            echo "Ad-hoc signed, as expected without a Developer ID."
            exit 0
          fi
          for code in "$app" "$appex"; do
            info="$(codesign --display --verbose=4 "$code" 2>&1)"
            grep -qF "Authority=$APPLE_SIGNING_IDENTITY" <<< "$info" || { echo "::error::$code isn't signed with $APPLE_SIGNING_IDENTITY"; echo "$info"; exit 1; }
            grep -q "flags=.*runtime" <<< "$info" || { echo "::error::$code doesn't use the hardened runtime, which notarisation needs."; exit 1; }
            grep -q "^Timestamp=" <<< "$info" || { echo "::error::$code has no secure timestamp, which notarisation needs."; exit 1; }
          done
          if [ "$MDV_SIGNING" = notarized ]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app" 2>&1 | tee /dev/stderr | grep -q "source=Notarized Developer ID"
          fi
      - name: Clean up signing
        if: always()
        run: |
          if [ -n "${MDV_KEYCHAIN:-}" ]; then security delete-keychain "$MDV_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
      - name: Keep the DMG (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
