name: Feature request
description: Suggest something MDViewer should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: MDViewer aims to stay a small, fast viewer (not an editor), so the most useful requests describe the problem first.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way today.
      placeholder: When I open … I want to … but …
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Mockups or examples from other apps are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
