[package]
name = "mdviewer"
version = "0.3.2"
description = "A native-feeling Markdown viewer for macOS"
authors = ["Mikael Rousson"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mdviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
tauri = { version = "~2.11", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "~2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "~2.7"
tauri-plugin-store = "~2.4"
tauri-plugin-window-state = "~2.4"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
dunce = "1.0.5"
tokio = { version = "1", features = ["sync", "macros"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
# Optimise for size: the heavy lifting (Markdown, highlighting, diagrams) runs
# in the web view, so the Rust side doesn't need speed. About 40% smaller code.
opt-level = "z"
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["objc2-uniform-type-identifiers", "block2"] }
objc2-foundation = "0.3.2"
objc2-uniform-type-identifiers = "0.3.2"
security-framework = "3"
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "objc2-app-kit"] }
